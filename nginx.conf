server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Hỗ trợ SPA (Single Page Application) - chuyển hướng mọi route về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bộ nhớ đệm (Cache) cho file tĩnh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Không cache index.html để đảm bảo người dùng luôn nhận bản cập nhật mới nhất
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
